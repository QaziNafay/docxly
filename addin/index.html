<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docxly - Automated</title>
    <base href="/" />
    <script>
        // Point Blazor at the directory this page is served from, so it works
        // both locally and under a subpath (e.g. /docxly/addin/).
        (function () {
            var dir = location.pathname.replace(/[^/]*$/, "");
            var base = document.querySelector("base");
            if (base) { base.setAttribute("href", dir || "/"); }
        })();
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>
    <div id="app">
        <div class="loading">Loading Docxly...</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <script src="office.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
